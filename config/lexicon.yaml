# AM domain lexicon: canonical entities, aliases and normalization confidence.
#
# * Aliases are plain strings (confidence 0.95) or {text, confidence, case_sensitive}.
# * Acronyms of <= 5 characters that are ALL CAPS are matched case-sensitively.
# * "Do not blindly merge": related-but-distinct concepts get their OWN entry
#   (e.g. SLS vs LPBF, WAAM vs DED, keyhole porosity vs porosity). Trade names
#   that designate the same process category get a lower alias confidence.
# * `dimensions` lists the physical dimensions a value may have (units.py).
# * Manual corrections made in the review UI are stored separately in
#   data/review/normalization_overrides.json and take precedence over this file.
#
# Sources for process terminology: ISO/ASTM 52900 process categories.

