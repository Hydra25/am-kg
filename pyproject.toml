[project]
name = "am-kg"
version = "0.1.0"
description = "Evidence-grounded Knowledge Graph and Research Assistant for Additive Manufacturing literature"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adarsh Kumar" }]
# Runtime dependencies are listed in requirements.txt (pip install -r requirements.txt)

# ---------------- Ruff: linter + import sorter ----------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E/W = style errors, F = real bugs (unused imports, undefined names),
# I = import order, B = common bug patterns (flake8-bugbear)
select = ["E", "W", "F", "I", "B"]
ignore = [
    "E501",  # long lines: readability is judged by reviewers, not a hard error
    "E702",  # short `a; b` statements are used deliberately in the UI code
    "B008",  # function calls in defaults (used intentionally with pydantic Field)
    "B905",  # zip(strict=...) - our zips pair lists that are equal by construction
    "B019",  # lru_cache on a small, long-lived prompt loader is intended
    "B027",  # optional no-op hook in the GraphStore base class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# PyMuPDF (SWIG bindings) prints harmless DeprecationWarnings on Python 3.12+
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap", "ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
